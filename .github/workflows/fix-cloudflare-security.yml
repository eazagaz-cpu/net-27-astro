name: Check Production Indexing Health

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  check-indexing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify canonical sitemap and robots
        shell: bash
        run: |
          set -euo pipefail
          googlebot='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'

          curl --fail --silent --show-error \
            --user-agent "$googlebot" \
            --output sitemap.xml \
            --dump-header sitemap.headers \
            https://net27.watch/sitemap.xml
          grep -qi '^content-type: application/xml' sitemap.headers
          grep -q '<urlset' sitemap.xml
          test "$(grep -o '<loc>' sitemap.xml | wc -l)" -gt 0

          curl --fail --silent --show-error \
            --user-agent "$googlebot" \
            --output sitemap-index.xml \
            https://net27.watch/sitemap-index.xml
          grep -q '<sitemapindex' sitemap-index.xml
          grep -q 'https://net27.watch/sitemap-0.xml' sitemap-index.xml

          curl --fail --silent --show-error \
            --user-agent "$googlebot" \
            https://net27.watch/robots.txt > robots.txt
          grep -q '^Sitemap: https://net27.watch/sitemap.xml$' robots.txt
          ! grep -Eq '^Disallow: /player/?' robots.txt

      - name: Verify canonical host and noindex headers
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://net27.watch/sitemap_index.xml)" = '301'
          curl --fail --silent --show-error --head 'https://net27.watch/player/?type=movie&id=969681' | grep -qi 'x-robots-tag:.*noindex'

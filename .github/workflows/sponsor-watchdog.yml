name: 🛡️ Sponsor Links Watchdog

# Every hour: are all sponsor links from src/data/sponsor-links.json live on
# net27.watch (homepage HTML above Top 10, both /api rails, served from KV)?
#   - API/KV wrong  → re-push KV from the manifest, then check again.
#   - still wrong, or the HTML itself is wrong → this run fails and GitHub
#     emails the owner.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# Separate from "production-deploy": that group cancels in-progress runs,
# and a watchdog must never cancel a deploy.
concurrency:
  group: sponsor-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write   # redeploy via fast-deploy.yml when the live HTML is wrong

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check live site
        id: check
        run: |
          set +e
          node scripts/sponsor-watchdog.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # ── Self-heal: KV lost or degraded → restore it from the manifest ─────
      - name: Install dependencies (heal only)
        if: steps.check.outputs.code == '2'
        run: npm ci

      - name: 🔐 Verify Cloudflare account & project (heal only)
        if: steps.check.outputs.code == '2'
        run: node scripts/preflight-auth.mjs --ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🩹 Re-push sponsor links to KV (heal only)
        if: steps.check.outputs.code == '2'
        run: node scripts/push-sponsors.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Re-check after heal
        if: steps.check.outputs.code == '2'
        run: |
          sleep 40
          node scripts/sponsor-watchdog.mjs

      # ── Wrong HTML → something else was deployed over ours: redeploy ───────
      # Seen 2026-09-26: the old private repo eazagaz-cpu/net27.watch still
      # ran its own "Auto Sync & Deploy" into the same Pages project and
      # replaced this site with a build that has no rails and no /api. This
      # redeploys our main, then checks again; if that fails too, the run
      # fails and the owner gets the email.
      - name: 🩹 Redeploy this repo's main (HTML wrong)
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::Live homepage is missing sponsor links — another build was deployed over ours (check other repos deploying to net-27-astro). Redeploying main."
          gh workflow run fast-deploy.yml --ref main -R "$GITHUB_REPOSITORY"
          sleep 15
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow fast-deploy.yml -L 1 --json databaseId --jq '.[0].databaseId')
          gh run watch "$id" -R "$GITHUB_REPOSITORY" --exit-status
          sleep 60
          node scripts/sponsor-watchdog.mjs

      - name: ❌ Still broken after redeploy
        if: failure()
        run: |
          echo "::error::Sponsor links are still missing from net27.watch after the automatic redeploy. See the steps above."
          exit 1

name: SEO Indexing Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build static output without remote content refresh
        run: npx astro build
      - name: Validate sitemap, robots, canonicals and structured data
        run: npm run validate:indexing

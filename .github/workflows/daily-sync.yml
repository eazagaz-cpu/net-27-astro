name: Auto Sync & Deploy

# Runs 4× per day — fetches fresh TMDB/Trakt data, builds the static site,
# and deploys to Cloudflare Pages automatically.
# No manual intervention needed.

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC  — 6:30 AM IST
    - cron: '0 7 * * *'   # 07:00 UTC  — 12:30 PM IST
    - cron: '0 13 * * *'  # 13:00 UTC  — 6:30 PM IST
    - cron: '0 19 * * *'  # 19:00 UTC  — 12:30 AM IST
  workflow_dispatch:       # manual trigger from GitHub → Actions tab

# ── Concurrency Protection ────────────────────────────────────────────────────
# Agar purana deploy chal raha ho aur naya trigger aaye, purana cancel ho jaata hai.
# Yeh race condition se bachata hai (old deploy overwriting new KV data).
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # needed for git push in "Commit updated cache" step

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Setup Node with npm cache ──────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. 🔍 INTEGRITY GATE — Verify canonical sponsor-links.json ────────
      # Deploy block hoga agar sponsor data invalid ya incomplete ho.
      - name: 🔍 Verify Sponsor Links Integrity
        run: node scripts/verify-links.mjs

      # ── 5. Fetch fresh TMDB + Trakt data → src/data/cache/*.json ─────────
      - name: Sync TMDB & Trakt content
        run: node src/scripts/movie-sync.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}

      # ── 6. Build static site ──────────────────────────────────────────────
      - name: Build site
        run: npx astro build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Validate indexing output
        run: npm run validate:indexing

      # ── 7. 🎰 KV Push FIRST — Deploy se PEHLE! ───────────────────────────
      # CRITICAL: KV push deploy se PEHLE hota hai.
      # push-sponsors.mjs: empty overwrite protection + read-back verification.
      - name: 🎰 Push Sponsor Links to Cloudflare KV (BEFORE DEPLOY)
        run: node scripts/push-sponsors.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── 8. Deploy dist/ to Cloudflare Pages ──────────────────────────────
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name net-27-astro --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── 9. 🌐 Post-Deploy Production Verification ─────────────────────────
      # Live site se data fetch karke expected counts verify karta hai.
      # Non-blocking (Cloudflare propagation time lagta hai).
      - name: 🌐 Post-Deploy Production Verification
        run: |
          echo "Waiting 30s for Cloudflare propagation..."
          sleep 30
          node scripts/verify-production.mjs
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # ── 10. Commit updated cache back to repo (for local dev use) ──────────
      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/cache/
          git diff --staged --quiet || (git commit -m "chore: TMDB cache refresh [skip ci]" && git push)
